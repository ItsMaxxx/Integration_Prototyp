services:
  frontend:
    build: ./frontend
    container_name: proofm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build: ./backend
    container_name: proofm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Im Container immer ins Volume schreiben – unabhängig von der lokalen .env
      - APP_PORT=3000
      - DB_PATH=/app/data/proofm.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - proofm-data:/app/data
    networks:
      - internal

volumes:
  proofm-data:

networks:
  internal:
    driver: bridge
