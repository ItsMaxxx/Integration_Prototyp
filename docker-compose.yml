# Fester Projektname: unabhängig vom Ordnernamen (Container & Volume "integrationprototyp_proofm-data")
name: integrationprototyp

services:
  frontend:
    # Kontext = Projekt-Root, damit die package-lock.json im Build verfügbar ist
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: proofm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: proofm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Im Container immer ins Volume schreiben – unabhängig von der lokalen .env
      - APP_PORT=3000
      - DB_PATH=/app/data/proofm.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - proofm-data:/app/data
    networks:
      - internal

volumes:
  proofm-data:

networks:
  internal:
    driver: bridge
