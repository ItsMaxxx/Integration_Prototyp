server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # LVs und Protokolle können größer sein als die 1 MB Standardgrenze
    client_max_body_size 25m;

    # API ans Backend im internen Docker-Netz weiterreichen (gleicher Ursprung → Session-Cookie funktioniert)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Claude-Analysen können etwas dauern
        proxy_read_timeout 180s;
    }

    # React-Router: alle anderen Pfade liefern die SPA aus
    location / {
        try_files $uri $uri/ /index.html;
    }
}
